    <style>
        :root {
            --app-bg: #050505;
            --app-text: #ffffff;
            --accent-color: #FFD700;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--app-bg, #050505);
            color: var(--app-text, #ffffff);
            cursor: crosshair;
            overflow: hidden;
        }
        .code-font {
            font-family: 'JetBrains Mono', monospace;
        }
        .tech-font {
            font-family: 'Share Tech Mono', monospace;
        }
        
        /* Custom Scrollbar for Cyber Theme */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #333; 
            border-radius: 0px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color, #FFD700); 
        }

        /* CRT Overlay Effect */
        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 50;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }
        
        @keyframes flicker {
            0% { opacity: 0.97; }
            50% { opacity: 0.99; }
            100% { opacity: 0.96; }
        }

        /* Scan Line Animation */
        @keyframes scanline {
            0% { transform: translateY(-100%); opacity: 0.5; }
            50% { opacity: 0.2; }
            100% { transform: translateY(100%); opacity: 0.5; }
        }
        .scan-line::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 0%, rgba(50, 255, 50, 0.1) 50%, transparent 100%);
            animation: scanline 6s linear infinite;
            pointer-events: none;
            z-index: 10;
        }

        /* Glitch Animation */
        @keyframes glitch-anim {
            0% { clip-path: polygon(0 2%, 100% 2%, 100% 5%, 0 5%); transform: translate(0); }
            2% { clip-path: polygon(0 78%, 100% 78%, 100% 100%, 0 100%); transform: translate(-2px, 2px); }
            4% { clip-path: polygon(0 78%, 100% 78%, 100% 100%, 0 100%); transform: translate(2px, -2px); }
            6% { clip-path: polygon(0 0, 0 0, 0 0, 0 0); transform: translate(0); }
            100% { clip-path: polygon(0 0, 0 0, 0 0, 0 0); transform: translate(0); }
        }
        .glitch-hover:hover {
            animation: glitch-anim 2s infinite linear alternate-reverse;
            color: #FF3B3B;
            text-shadow: 2px 2px #FFD700;
        }

        /* Pulsing Glow */
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 5px rgba(255, 215, 0, 0.2); }
            50% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); border-color: #FFD700; }
            100% { box-shadow: 0 0 5px rgba(255, 215, 0, 0.2); }
        }
        .pulse-border {
            animation: pulse-glow 3s infinite;
        }

        @keyframes caret-blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .typing-caret {
            display: inline-block;
            width: 8px;
            height: 16px;
            margin-left: 6px;
            background: var(--accent-color, #FFD700);
            animation: caret-blink 0.9s steps(2, start) infinite;
            vertical-align: -2px;
        }

        /* Crime Tape Marquee */
        @keyframes tape-marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }
        .tape-marquee {
            display: flex;
            align-items: center;
            white-space: nowrap;
            width: max-content;
            will-change: transform;
            animation: tape-marquee 40s linear infinite;
        }
        .tape-set {
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
        }
        .tape-set > span {
            padding-right: 2rem;
        }
        .tape-rail {
            position: relative;
            mask-image: linear-gradient(90deg, transparent 0%, #000 3%, #000 97%, transparent 100%);
            -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 3%, #000 97%, transparent 100%);
        }
        .tape-rail::before,
        .tape-rail::after {
            content: "";
            position: absolute;
            top: 0;
            width: 24px;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .tape-rail::before {
            left: 0;
            background: linear-gradient(90deg, rgba(0,0,0,0.2), transparent);
        }
        .tape-rail::after {
            right: 0;
            background: linear-gradient(270deg, rgba(0,0,0,0.2), transparent);
        }
    </style>
